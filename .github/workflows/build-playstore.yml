name: Build Signed Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Add Android Platform
        run: |
          npm install --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Configure Portrait Orientation & AdMob App ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const appId = (process.env.ADMOB_APP_ID || "").trim();
            if (!appId || !appId.includes("~")) throw new Error("Missing or invalid ADMOB_APP_ID secret (must contain ~)");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            xml = xml.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"portrait\"");
            const tag = `<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="${appId}"/>`;
            xml = xml.replace("</application>", `${tag}\n    </application>`);
            fs.writeFileSync(path, xml);
          '

      - name: Configure 64-Bit Architectures (ABI Filters)
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let gradle = fs.readFileSync(path, "utf8");
            const ndkBlock = "defaultConfig {\n        ndk {\n            abiFilters \"arm64-v8a\", \"armeabi-v7a\", \"x86_64\", \"x86\"\n        }";
            if (!gradle.includes("abiFilters")) {
              gradle = gradle.replace("defaultConfig {", ndkBlock);
              fs.writeFileSync(path, gradle);
            }
          '

      - name: Decode Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build & Sign Release AAB
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: haloguard-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
